name: CI

on:
  pull_request:

jobs:
  verificar:
    name: Lint, tipos e build
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Checagem de tipos
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: senha-de-ci
          AUTH_SECRET: segredo-de-ci-com-mais-de-trinta-e-dois
          DATABASE_URL: file:data/mkdrones61.db
